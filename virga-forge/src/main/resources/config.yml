# Virga配置文件，位于服务器的 config/virga/config.yml。
# 大部分设置可以在管理面板里改；手动修改后在控制台执行 virga reload 生效。
config-version: 1

brand:
  # 机器人在 QQ 群里的名字。
  bot-name: "Virga"
  server-name: "MinecraftServer"
  # QQ 群里单独发“服务器地址”时，Virga 会回复这里的地址；留空表示不回复。
  # 填你自己服务器的地址（Virga 不内置任何地址），也可以在管理面板“功能设置”或游戏里 /virga address <地址> 修改。
  server-address: ""

bot:
  # 填好 QQ 机器人的 AppID、Secret 后改为 true（也可以在管理面板扫码连接）。
  # 启动后在游戏里执行 /virga group add，就能把 QQ 群接进来。
  enabled: false
  app-id: ""
  secret: ""
  groups: []
  suppress-sdk-console-output: true

administrators:
  # 超级管理员（roots）：填 QQ OpenID，也可以在管理面板“成员与权限”里设置；不能在群里删除。
  roots: []
  # 是否把 QQ 群主/群管理员自动当作 Virga 的管理员。
  trust-qq-group-roles: false

# 在管理面板“群管理 → 指令面板”里设置群用途、指令开关、展示文字和顺序。
# 没配置过的群默认是玩家群：默认只开放玩家功能，管理指令默认只在管理群开放；
# 在玩家群打开管理指令属于高危设置，管理面板会要求确认。
qq-command-panels:
  groups: {}

features:
  chat-bridge:
    game-to-qq: false
    qq-to-game: false
    # 只有以这个前缀开头的游戏聊天才会转发到 QQ；留空表示全部转发。
    game-prefix: ""
    game-to-qq-format: "[游戏] {name}: {message}"
    qq-to-game-format: "[QQ] {name}: {message}"
  player-notices:
    join-enabled: false
    quit-enabled: false
    join-format: "{name} 进入了 {server}，欢迎～"
    quit-format: "{name} 离开了 {server}，下次再来玩哦"
  remote-commands:
    enabled: false
    root-only: true
  performance:
    enabled: true
    cooldown-seconds: 5
    font-family: ""
  online-list:
    enabled: true
    cooldown-seconds: 3
    page-size: 27
    administrators-first: true
    # 拥有这个权限的玩家在在线列表里排前面并标为管理。
    # 装了权限模组（如 LuckPerms）时按权限节点判断，否则按 OP 等级 2 判断。
    administrator-permission: "virga.online.priority"
    columns: 3
    font-family: ""
    footer-text: "POWERED BY Virga"
    skin:
      enabled: true
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
      cache-entries: 200
      fallback-avatar: "steve"
  binding:
    enabled: true
    # 可选的入服门槛：开启后没绑定 QQ 的玩家会被请出服务器，并在提示页拿到验证码，
    # 到 QQ 群绑定后再进服。机器人断线、绑定不可用或没有开放绑定的群时会临时放行。
    # 不要同时用白名单拦新玩家，否则他们没法进服领验证码。
    force-bind: false
    # 提示页里展示的真实 QQ 群号（不是 GroupOpenID）；可以填多个，留空则不展示。
    force-bind-groups: []
    # 不需要强制绑定的老玩家游戏 ID（不区分大小写），例如 [OldPlayer, AnotherPlayer]。
    verify-exempt: []
    challenge-expire-seconds: 300
    # QQ 提交验证码后，玩家在游戏里点确认/拒绝的有效时间。
    confirmation-expire-seconds: 120
    challenge-cooldown-seconds: 10
    max-attempts: 3
    max-accounts: 2
    selection-expire-seconds: 60
  inventory:
    enabled: true
    ender-chest-enabled: true
    cooldown-seconds: 5
    # 每隔多少秒给在线玩家存一份离线快照（玩家下线时也会存）。
    periodic-snapshot-seconds: 300
    theme: "virga"
    player-head-textures:
      enabled: true
      memory-entries: 4096
      # 单次查询最多准备几种新的头颅纹理，避免一次产生太多下载任务。
      max-new-per-request: 4
      max-outstanding: 32
      max-concurrent: 2
      negative-cache-seconds: 600
      connect-timeout-ms: 2000
      read-timeout-ms: 3000

# 图片底图（在线列表、服务器状态、背包、末影箱）。每张底图分成背景 / 毛玻璃 / 卡片几层，
# 把自己的图片放进 config/virga/backgrounds/ 就只替换最底下的背景层，卡片和文字位置不变：
#   online-list.png  status.png  inventory.png  ender-chest.png （也可以用 .jpg/.jpeg）
# 图片会自动等比放大裁切铺满，换图后下一次出图就生效，不用重启。
appearance:
  custom-backgrounds: true
  # 自定义背景上盖一层奶白色柔光，数字越大越淡（0–80），让文字更清楚。
  veil-percent: 15

# 在管理面板“自定义指令”里维护，保存后立即生效。
# 模板以控制台权限执行，只应由信得过的服主管理。
# 支持 {player}/{name}（本群已验证的主账号）、{params}、{0}–{9}。
custom-commands: []

runtime:
  worker-threads: 2
  queue-capacity: 128
  scheduled-task-limit: 128
  addon-timeout-seconds: 30
  image-limit-bytes: 8388608
  # 图片渲染固定单线程；皮肤下载默认 4 线程，所有队列都有上限。
  render-queue-capacity: 8
  skin-threads: 4
  skin-queue-capacity: 64
  # 绑定与离线快照共用的单线程保存队列。
  state-queue-capacity: 64
  image-command-timeout-seconds: 15

# 存储清理：服务器启动时清理一次，之后每天一次，不影响游戏。
storage:
  # cache/ 下的皮肤、头颅、盔甲图标、人物预览超过这么多天没更新就删除，用到时会重新生成。
  cache-days: 30
  # 超过这么多天没上线的玩家，删除其离线背包快照和保存的皮肤。
  snapshot-days: 180
  # 面板操作记录（state/panel-audit.log）超过这个大小（KB）就压缩归档到 state/audit-archive。
  audit-rotate-kb: 512
  # 最多保留几份归档，更早的自动删除。
  audit-archives: 10

# Virga 管理面板（Web UI）。只监听本机 127.0.0.1，请通过 SSH 隧道访问，例如：
#   ssh -N -L 127.0.0.1:56789:127.0.0.1:56789 你的服务器
# 然后在自己电脑的浏览器打开 http://127.0.0.1:56789/ 。
# 第一次启动会在控制台显示一次随机密码；控制台执行 virga passwd <新密码> 可以自定义，
# virga passwd 重新随机生成。
panel:
  enabled: true
  # 1024–65535；也可以在面板里修改，改完面板会换到新端口。
  port: 56789
  # 扫码连接 QQ 机器人（非官方实现，失效时请在面板里手动填写 AppID/Secret）。
  qr-connect:
    enabled: true
